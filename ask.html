<!-- ask.html — RETIRED (Phase 7).
     Lixa (index.html) now runs this exact same chat engine (js/ask.js,
     unmodified) embedded in the main app shell, so this page is no
     longer a separate destination. It's kept as a redirect — rather
     than deleted outright — so existing bookmarks/links/search-engine
     results still land somewhere real instead of a 404, and any ?q=...
     deep link still prefills the question, just inside Lixa now.
     See REFACTOR-NOTES.md, Phase 7. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>rehablix — redirecting to Lixa…</title>
  <link rel="icon" href="favicon.ico">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1418;
      color: #e6ecef;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .redirect-card { max-width: 360px; }
    .redirect-spinner {
      width: 32px; height: 32px; margin: 0 auto 1rem;
      border: 3px solid rgba(0, 150, 136, 0.25);
      border-top-color: #009688;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #009688; }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="redirect-spinner" aria-hidden="true"></div>
    <p>Ask AI is now part of Lixa. Taking you there…</p>
    <noscript>
      <p><a id="manualLink" href="index.html">Continue to rehablix →</a></p>
    </noscript>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search).get('q');
      var dest = 'index.html' + (q ? '?q=' + encodeURIComponent(q) : '');
      window.location.replace(dest);
    })();
  </script>
</body>
</html>
